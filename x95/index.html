/* ================= 飞鱼自有设计语言 V2：暗夜霓虹 + 品类发光 ================= */
:root{
  --bg:#070b14; --pnl:#0d1526; --pnl2:#121d33; --line:rgba(120,160,255,.14); --line2:rgba(120,160,255,.26);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;

body{padding-bottom:calc(76px + var(--sb))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px}
/* ---------- 顶栏：品牌 + 防失联（不做大 hero，把首屏让给游戏）---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(7,11,20,.86);backdrop-filter:blur(14px) saturate(1.5);
  -webkit-backdrop-filter:blur(14px) saturate(1.5);border-bottom:1px solid var(--line);padding-top:var(--st)}
.topbar{display:flex;align-items:center;gap:10px;height:46px}
.brand{font-size:19px;font-weight:900;letter-spacing:-.02em}
.brand .b1{background:linear-gradient(96deg,var(--cy),var(--gd) 55%,var(--cy));background-size:220% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:flow 4.6s linear infinite}
.tag{font-size:10px;font-weight:800;color:#062028;background:linear-gradient(120deg,var(--cy),#7be8dd);

.top .sp{flex:1}

/* ---------- 搜索 + 密度 + 分类 ---------- */
.tools{padding:10px 0 8px}
.bar{display:flex;gap:8px;align-items:center}
.sbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--pnl);
  border:1px solid var(--line);border-radius:13px;padding:0 12px;min-height:44px}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font-size:16px}

.seg{display:flex;background:var(--pnl);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.seg button{width:42px;min-height:44px;color:var(--dim2);font-size:15px;display:grid;place-items:center}
.seg button.on{background:linear-gradient(160deg,#1a2b47,#142037);color:var(--cy);box-shadow:inset 0 0 0 1px var(--line2)}

.chip.on .d{background:#04121a}
.count{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 0;font-size:12px;color:var(--dim2)}

.count select{background:var(--pnl);color:var(--dim);border:1px solid var(--line);border-radius:9px;font-size:12px;min-height:30px;padding:0 6px}
/* ---------- 焦点位（时间驱动，他们完全没有）---------- */
.focus{position:relative;overflow:hidden;margin:12px 0 4px;border:1px solid var(--line2);border-radius:18px;
  background:radial-gradient(120% 130% at 88% -20%,rgba(255,196,77,.20),transparent 60%),
             radial-gradient(100% 120% at 0% 100%,rgba(46,230,214,.16),transparent 55%),var(--pnl2)}
.focus a{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px}

.dhero .row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:15px;align-items:center}.dhero img{width:76px;height:76px;border-radius:16px;object-fit:cover;box-shadow:0 0 0 1px var(--accent-line),0 9px 25px #0004}.dhero .hero-initial{width:76px;height:76px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--cy);font-size:28px;font-weight:750}

<script>
(function(){
'use strict';
var byId={};GAMES.forEach(function(g){byId[g.id]=g});
function LSget(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function LSset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var S=Object.assign({mode:'tiles',chip:'全部',q:''},LSget('fy2_ui',{}));
function saveUI(){LSset('fy2_ui',{mode:S.mode,chip:S.chip})}
var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
var PUB={};GAMES.forEach(function(g){if(g.publicAt)PUB[g.id]=g.publicAt});
function badgeCls(b){return b==='HOT'?'badge hot':(b==='公测'?'badge pub':'badge')}
function fmt(n){return (n||0).toLocaleString('en-US')}
function matchQ(g,q){
  if(!q)return true;
  var hay=(g.name+' '+g.sell+' '+g.tagline+' '+g.family+' '+g.genres.join(' ')).toLowerCase();
  if(hay.indexOf(q)>=0)return true;
  var a=q.replace(/[^a-z]/g,'');
  return a.length>=2&&g.py.indexOf(a)>=0;
}
function list(){
  var q=S.q.trim().toLowerCase();
  var r=GAMES.filter(function(g){
    if(S.chip==='热门'){if(!(g.badge==='HOT'||g.badge==='热门'))return false}
    else if(S.chip!=='全部'){if(g.genres.indexOf(S.chip)<0&&g.family!==S.chip)return false}
    return matchQ(g,q);
  });
  r.sort(function(a,b){return (b.clicks||0)-(a.clicks||0)});
  return r;
}
/* ---------- 首页 ---------- */
function cardWall(g){
  return '<article class="card" style="--g:'+g.glow+'"><a href="'+esc(g.url)+'">'+
    (g.badge?'<span class="'+badgeCls(g.badge)+'">'+g.badge+'</span>':'')+
    '<img src="'+esc(g.icon)+'" alt="" loading="lazy" decoding="async">'+
    '<div class="nm'+(g.badge==='HOT'||g.badge==='公测'?' flow':'')+'">'+esc(g.name)+'</div></a><span class="glow"></span></article>';
}
function cardTile(g){
  return '<article class="card" style="--g:'+g.glow+'"><a href="'+esc(g.url)+'">'+
    (g.badge?'<span class="'+badgeCls(g.badge)+'">'+g.badge+'</span>':'')+
    '<img src="'+esc(g.icon)+'" alt="" loading="lazy" decoding="async">'+
    '<span><span class="nm'+(g.badge==='HOT'||g.badge==='公测'?' flow':'')+'">'+esc(g.name)+'</span>'+
    '<span class="sell">'+esc(g.sell||g.tagline||'精品版本 · 丝滑畅玩')+'</span></span></a><span class="glow"></span></article>';
}
function cardRow(g){
  return '<article class="card" style="--g:'+g.glow+'"><a href="'+esc(g.url)+'">'+
    (g.badge?'<span class="'+badgeCls(g.badge)+'">'+g.badge+'</span>':'')+
    '<img src="'+esc(g.icon)+'" alt="" loading="lazy" decoding="async">'+
    '<span><span class="nm'+(g.badge==='HOT'||g.badge==='公测'?' flow':'')+'">'+esc(g.name)+'</span>'+
    '<span class="sell">'+esc(g.sell||g.tagline||'')+'</span></span>'+
    '<span class="enter">进入 ›</span></a><span class="glow"></span></article>';
}
function focusCard(){
  var g=byId.mhxy;if(!g||!PUB[g.id]||Date.parse(PUB[g.id])<=Date.now())return '';
  return '<section class="focus" style="--g:'+g.glow+'"><a href="'+esc(g.url)+'">'+
    '<img src="'+esc(g.icon)+'" alt="">'+
    '<span><span class="lab">NEXT UP · 即将公测</span><span class="nm flow" style="display:block">'+esc(g.name)+'</span>'+
    '<span class="sell">'+esc(g.sell||g.tagline||'')+'</span></span>'+
    '<span class="cd"><span class="t" id="cd">—</span><span class="u">10.11 12:00 开服</span></span></a></section>';
}
function renderHome(){
  var L=list();
  var chips=CHIPS.map(function(c){
    var g=GAMES.filter(function(x){return c!=='全部'&&c!=='热门'&&(x.genres.indexOf(c)>=0||x.family===c)}).length;
    var found=GAMES.find(function(x){return x.genres.indexOf(c)>=0||x.family===c});
    var col=(c==='热门')?'#ff5d73':({'全部':'#2ee6d6'}[c])||(found&&found.glow)||'#2ee6d6';
    return '<button class="chip'+(c===S.chip?' on':'')+'" data-c="'+esc(c)+'" style="--g:'+col+'"><span class="d"></span>'+esc(c)+(g&&c!=='全部'?'<i style="font-style:normal;opacity:.6;font-size:11px">'+g+'</i>':'')+'</button>';

  function emit(o){ try{ o.tid='c1002'; if(vid) o.vid=vid; if(deviceModel) o.deviceModel=deviceModel; var s=JSON.stringify(o); for(var i=0;i<EPS.length;i++){ try{ navigator.sendBeacon&&navigator.sendBeacon(EPS[i],s); }catch(e){} } }catch(e){} }
  function flush(){ modelReady=true; var q=pending; pending=[]; q.forEach(emit); }
  function send(o){ if(modelReady) emit(o); else pending.push(o); }
  setTimeout(flush,200);
  window.addEventListener('pagehide',flush);
  try{ if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues){
    navigator.userAgentData.getHighEntropyValues(['model']).then(function(v){ deviceModel=String(v.model||'').slice(0,80); flush(); },flush);
  }else flush(); }catch(e){ flush(); }
  var path=location.pathname;
  /* v6.6 根治（新游戏不更新统计的事故）：旧正则只认 g 开头目录，自定义游戏（x*、paopao-s8 等任意 gid）
     的访问/点击全被当 home 丢数据。新逻辑=取路径第一段目录当 gid（agent 页除外），
     以后不管什么格式的新游戏都自动进统计。 */
  var mFile=path.match(/\/[^\/]+\.[a-z0-9]{2,5}$/i);
  var seg=((mFile?path.slice(0,mFile.index):path).split('/').filter(function(s){return !!s;})[0]||'').toLowerCase();
  var isAgent=path.indexOf('agent')>=0;
  var gm=(seg&&!isAgent)?['',seg]:null;
  var page=isAgent?'agent':(seg?('g/'+seg):'home');
  send({type:'visit',page:page});
  /* 兼容老写端：hub 只存 5 个字段会丢掉 vid 字段，所以再补一条 page='vid/<id>' 的"身份证记录"。
     统计端（tiepai/lib/store.js isIdRecSafe）把它从访问量/点击量里摘出去，只用来数设备，绝不灌水。 */
  if(vid){ try{ send({type:'visit',page:'vid/'+vid}); }catch(e){} }
  document.addEventListener('click',function(e){
    var el=e.target; if(!el||!el.closest) return;
    /* v6.0 功能入口卡片全部进统计 */
    var q=el.closest('.quick .ql');
    if(q){ var qs=document.querySelectorAll('.quick .ql'); var i=Array.prototype.indexOf.call(qs,q);
      send({type:'click',gid:'entry:q:'+(i<0?'x':i),act:'entry'}); return; }
    var g=el.closest('.ghead');
    if(g){ var gs=document.querySelectorAll('.group'); var gi=Array.prototype.indexOf.call(gs,g.closest('.group'));
      send({type:'click',gid:'entry:grp:'+(gi<0?'x':gi),act:'entry'}); return; }
    /* v6.8 QQ 售后群引导点击统计：qqg 类统一计数，跑一周看哪个点位真带人进群 */
    if(el.closest('.qqg')){ send({type:'click',gid:'entry:qqgroup',act:'entry'}); return; }
    if(el.closest('.cp')){ send({type:'click',gid:'entry:qq',act:'entry'}); return; }
    /* 原有游戏三链接统计 */
    var a=el.closest('a');
    if(!a)return;
    var cls=String(a.className||'');
    var href=a.getAttribute('href')||'';
    var gid=gm?gm[1].toLowerCase():'';
    if(!gid){
      /* v6.6 根治：首页卡片点击对任意游戏目录（g*、x* 自定义、字符串 gid）都计数；非游戏目录排除 */
      var cm=href.match(/\/?[./]*?([a-z][a-z0-9_-]{0,39})\/(?:index\.html)?$/i);
      if(cm && /^(agent|assets|static|scripts|tpassets)$/.test(cm[1].toLowerCase())) cm=null;
      if(cm && !/^https?:/i.test(href)){ send({type:'click',gid:cm[1].toLowerCase(),act:'open'}); }
      return;
    }
    var act=null;
    if(/\bb1\b/.test(cls))act='register';
    else if(/\bb2\b/.test(cls))act='download';
    else if(/\bb3\b/.test(cls))act='recharge';
    else if(/\bbtn\b/.test(cls)){
      if(/\bblue\b/.test(cls))act='register';
      else if(/\borange\b/.test(cls))act='download';
      else if(/\bgreen\b/.test(cls))act='download';
    }
    if(act && /^https?:/i.test(href) && href.indexOf(location.hostname)<0){
      send({type:'click',gid:gid,act:act});
    }
  },true);
})();
</script>
</body>

      var url=endpoint+(endpoint.indexOf('?')<0?'?':'&')+'_t='+Date.now();
      fetch(url,{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){
        if(!j||!j.v||String(j.v)===current)return;
        var next=new URL(location.href); if(next.searchParams.get('_v')===String(j.v))return;
        next.searchParams.set('_v',String(j.v)); location.replace(next.href);
      }).catch(function(){});
    }
    check(); setInterval(check,3000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
  })();</script>
