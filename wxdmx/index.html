function clsLine(t){

  var kw=['元','充值','累充','限购','礼包','档位','档','CDK','兑换码','兑换','比例','周卡','月卡','终身卡','大月卡','新手','返利','首充'];
  var hit=kw.some(function(k){return s.indexOf(k)>=0});
  if([...s].length<=18&&/[0-9]/.test(s)&&hit&&!/＋/.test(t)&&!/[。！？]$/.test(t))return 'gold';
  return 'p';
}

    if(act && /^https?:/i.test(href) && (declared || href.indexOf(location.hostname)<0)){
      send({type:'click',gid:gid,act:act});
      window.fyTrack(act,gid);
    }
  },true);
})();
</script>
<script>(function(){'use strict';
/* 「已购」数字引擎（2026-10-11 星哥定稿）：
   ① 入场=老虎机式：各位数字一起转、从左到右依次定格到正确数（约 1–2 秒）；
   ② 玩家点「去充值」→ 该礼包数字 +1 滚动跳动，按礼包累积存本机（localStorage，刷新/回访不丢）；
   ③ 每日固定增长：预览由服务端每分钟下发；正式页用服务端烘焙的 ginc（未来90天每日增量）在本机续算，
      与服务端同一条曲线，无需任何后端；
   ④ 一圈光效常动（CSS 流光扫过胶囊边圈）；呼吸光晕每 25–50 秒随机点亮一个可见标记；
   ⑤ 所有滚动随机错开、绝不同步；prefers-reduced-motion 全关；隐藏标签页全部暂停。 */
if(!CONFIG.initialId)return;
if(!document.querySelector('.fy-num[data-sale]'))return;
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var GID=String(CONFIG.initialId),LSX='fyClickX:'+GID,X;
try{X=JSON.parse(localStorage.getItem(LSX)||'{}')}catch(e){X={}}
if(!X||typeof X!=='object'||X.pop)X={};
function saveX(){try{localStorage.setItem(LSX,JSON.stringify(X))}catch(e){}}
function els(){return [].slice.call(document.querySelectorAll('.fy-num[data-sale]'))}
function inView(el){var r=el.getBoundingClientRect();return r.top<window.innerHeight+80&&r.bottom>-80}
function extraOf(el){var v=X[el.getAttribute('data-sale')];return Number.isSafeInteger(v)&&v>0?v:0}
function baseOf(el){if(el._base==null)el._base=Number(el.getAttribute('data-n'))||0;return el._base}
function valOf(el){return el._val!=null?el._val:(Number(el.getAttribute('data-n'))||0)}
function fmt(n){return n.toLocaleString('zh-CN')}
/* 服务端烘焙曲线的本机续算：g0=曲线起点（北京时间当日零点），at=烘焙时刻，ginc=未来90天每日增量。 */
function gdelta(el,now){var m=CONFIG.salesCfg;if(!m||!Number.isFinite(m.g0)||!Number.isFinite(m.at))return 0;
 if(!el._ginc){var raw=(el.getAttribute('data-ginc')||'').replace(/^\[|\]$/g,'');el._ginc=raw?raw.split(',').map(Number):[];}
 var g=el._ginc;if(g.length<2||g.some(isNaN))return 0;
 var e=now-m.g0,eb=m.at-m.g0;if(!(e>0)||!(eb>0))return 0;
 var Dn=Math.floor(e/864e5),sn=Math.floor(e%864e5/60000),Db=Math.floor(eb/864e5),sb=Math.floor(eb%864e5/60000);
 var span=Dn-Db;if(span<0)return 0;if(span>g.length-1)span=g.length-1;
 var s=0;for(var k=0;k<span;k++)s+=g[k];
 s+=Math.floor(g[span]*sn/1440)-Math.floor(g[0]*sb/1440);return Math.max(0,Math.round(s));}
/* 价格链钳制：同一游戏里贵的不得高于便宜的（与服务端同规则），按天续涨后也不许倒挂。 */
function clampChain(list){var it=list.filter(function(o){return o.p!=null&&isFinite(o.p)}).sort(function(a,b){return a.p-b.p});
 var cap=Infinity,i=0;
 while(i<it.length){var j=i;while(j<it.length&&it[j].p===it[i].p)j++;
  for(var k=i;k<j;k++)it[k].b=Math.min(it[k].b,cap);
  var mn=Infinity;for(k=i;k<j;k++)mn=Math.min(mn,it[k].b);
  cap=Math.max(20,mn-3);i=j;}}
function computeAll(now){var list=els().map(function(el){
  var p=parseFloat(el.getAttribute('data-gp'));if(!isFinite(p))p=null;
  var t=baseOf(el)+(CONFIG.salesCfg&&!CONFIG.salesLive?gdelta(el,now):0);
  return {el:el,p:p,b:t,x:extraOf(el)};
 });
 clampChain(list);
 return list.map(function(o){return {el:o.el,t:Math.max(0,Math.round(o.b))+o.x}});
}
if(typeof window!=='undefined'&&window.FYTEST)window.FYSALES={gdelta:gdelta,clampChain:clampChain,computeAll:computeAll,extraOf:extraOf};
/* 老虎机逐位锁轮（星哥定稿：融合版方案二原参数）：每位数字一条带（位序×6+9 随机格 + 目标格 + 2 格回弹余量），
   各列同时起转、每列 760ms+位序×260ms 各自减速锁轮，锁轮瞬间回弹 0.05em 再坐实；_tk 令牌防竞态。 */
function slotTo(el,txt){
 if(RM){el.textContent=txt;return;}
 var tk=el._tk=(el._tk||0)+1,parts=String(txt).split(''),html='',idx=0,maxEnd=0,plans=[];
 for(var i=0;i<parts.length;i++){var ch=parts[i];
  if(ch>='0'&&ch<='9'){
   var steps=idx*6+9,strip='';
   for(var k=0;k<steps;k++)strip+='<span>'+Math.floor(Math.random()*10)+'</span>';
   strip+='<span>'+ch+'</span><span>'+Math.floor(Math.random()*10)+'</span><span>'+Math.floor(Math.random()*10)+'</span>';
   var dur=760+idx*260;
   if(dur>maxEnd)maxEnd=dur;
   html+='<span class="fy-col"><span class="fy-strip">'+strip+'</span></span>';
   plans.push({steps:steps,dur:dur,delay:0});idx++;
  }else html+='<span class="fy-sep">'+ch+'</span>';
 }
 el.innerHTML=html;
 var strips=el.querySelectorAll('.fy-strip');
 for(var s=0;s<strips.length&&s<plans.length;s++)(function(strip,plan){
  setTimeout(function(){
   if(el._tk!==tk)return;
   var t0=performance.now();
   (function frame(t){
    if(el._tk!==tk)return;
    var p=Math.min(1,(t-t0)/plan.dur),e=p<.82?(1-Math.pow(1-p/.82,2.4)):1-Math.sin((p-.82)/.18*Math.PI)*.05;
    strip.style.transform='translateY(-'+Math.max(0,e*plan.steps).toFixed(3)+'em)';
    if(p<1)requestAnimationFrame(frame);
    else strip.style.transform='translateY(-'+plan.steps+'em)';
   })(t0);
  },plan.delay);
 })(strips[s],plans[s]);
 setTimeout(function(){if(el._tk===tk)el.textContent=txt;},maxEnd+120);
}
function bump(el){var box=el.closest('.fy-sold,.fy-tier,.fy-firstbuy,.fy-wp-item');if(box){box.classList.remove('fy-num-bump');void box.offsetWidth;box.classList.add('fy-num-bump');}}
/* 来一笔全排亮：任何 +1（订单曲线/预览下发/点击充值）触发，入场滚动不触发。 */
function flashAll(){if(RM||document.hidden)return;
 var ps=document.querySelectorAll('.fy-sold:not(.is-empty)');for(var i=0;i<ps.length;i++){ps[i].classList.remove('fy-all-flash');void ps[i].offsetWidth;ps[i].classList.add('fy-all-flash');}
 var bs=document.querySelectorAll('.fy-pay');for(var j=0;j<bs.length;j++){bs[j].classList.remove('fy-wave');void bs[j].offsetWidth;bs[j].classList.add('fy-wave');}}
function roll(el,to){if(!(to>valOf(el)))return;el._val=to;el.setAttribute('data-n',String(to));slotTo(el,fmt(to));bump(el);flashAll();}
/* 入场：先算目标（烘焙值+本机续涨+点击累积，再过价格链），可见标记依次老虎机滚到正确数。 */
function entrance(){if(document.hidden)return;
 var list=computeAll(Date.now()),io=null;
 if('IntersectionObserver' in window)io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;io.unobserve(e.target);spin(e.target);});},{rootMargin:'80px'});
 list.forEach(function(o,i){var el=o.el;el._val=o.t;el.setAttribute('data-n',String(o.t));
  if(RM){el.textContent=fmt(o.t);return;}
  if(io)io.observe(el);else setTimeout(function(){spin(el)},(i%10)*90);});
 function spin(el){if(document.hidden||!inView(el))return;var w=el._j||(el._j=Math.floor(Math.random()*350));setTimeout(function(){if(document.hidden||!inView(el))return;slotTo(el,fmt(valOf(el)));},w);}}
/* 呼吸光晕：每 25–50 秒随机点亮一个可见标记（不改数字）。 */
(function breathe(){if(RM)return;setTimeout(function(){
 if(!document.hidden){var c=els().filter(inView);
  if(c.length){var el=c[Math.floor(Math.random()*c.length)],box=el.closest('.fy-sold,.fy-tier,.fy-firstbuy,.fy-wp-item');
   if(box&&!box.classList.contains('fy-num-bump')){bump(el);setTimeout(function(){box.classList.remove('fy-num-bump');},1700);}}}
 breathe();},25000+Math.floor(Math.random()*25000));})();
/* 玩家点「去充值」→ 该礼包 +1：滚动+跳动，累积存本机。 */
document.addEventListener('click',function(e){
 var a=e.target.closest('.fy-pay');if(!a)return;
 var pair=a.closest('.fy-sold-pair'),el=pair&&pair.querySelector('.fy-num[data-sale]');
 if(!el)return;var name=el.getAttribute('data-sale');
 X[name]=(X[name]||0)+1;saveX();roll(el,valOf(el)+1);
},true);
if(CONFIG.salesLive){
 /* 预览：服务端每分钟下发当前值（含当日按分钟摊开的增长），本机只叠点击累积。 */
 function pull(){if(document.hidden)return;fetch(CONFIG.salesLive+'&gid='+encodeURIComponent(GID),{cache:'no-store',credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(j){if(!j||!j.ok||!j.counts)return;
  els().forEach(function(el){var v=j.counts[el.getAttribute('data-sale')];if(Number.isSafeInteger(v)){var t=v+extraOf(el);if(t>valOf(el)){var wait=Math.floor(Math.random()*45000);setTimeout(function(){roll(el,t);},wait);}}});}).catch(function(){});}
 var wait=60000-(Date.now()%60000)+1500;setTimeout(function(){pull();setInterval(pull,60000);},wait);
 document.addEventListener('visibilitychange',function(){if(!document.hidden)pull();});
}else if(CONFIG.salesCfg){
 /* 正式页：每 60 秒按烘焙曲线本机续算，真涨了才滚；随机错开，绝不同步。 */
 setInterval(function(){if(document.hidden)return;
  computeAll(Date.now()).forEach(function(o){if(o.t>valOf(o.el)){var wait=Math.floor(Math.random()*30000);setTimeout(function(){roll(o.el,o.t);},wait);}});
 },60000);
 document.addEventListener('visibilitychange',function(){if(!document.hidden){computeAll(Date.now()).forEach(function(o){if(o.t>valOf(o.el))roll(o.el,o.t);});}});
}
entrance();
})();</script>
</body>
