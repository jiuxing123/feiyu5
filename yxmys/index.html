}

function clsLine(t){
  if(/^[一二三四五六七八九十]+\s*、/.test(t))return 'sec';
  var s=t.replace(/^[\s\d、（）()·\-—]+/,'');
  var kw=['元','充值','累充','限购','礼包','档位','档','CDK','兑换码','兑换','比例','周卡','月卡','终身卡','大月卡','新手','返利','首充'];
  var hit=kw.some(function(k){return s.indexOf(k)>=0});
  if([...s].length<=18&&/[0-9]/.test(s)&&hit&&!/＋/.test(t)&&!/[。！？]$/.test(t))return 'gold';
  return 'p';
}
