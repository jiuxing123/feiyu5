     这是"换网络、换出口 IP 仍算同一个人"的唯一办法——UA 做不到，IP 更做不到。 */
  var vid='';
  try{
    vid=localStorage.getItem('fyvid')||'';
    if(!vid){ var cm=document.cookie.match(/(?:^|; )fyvid=([a-z0-9_-]{1,40})/i); if(cm) vid=cm[1]; }
    if(!vid){ vid=Date.now().toString(36)+Math.random().toString(36).slice(2,10);
      try{ localStorage.setItem('fyvid',vid); }catch(e){}
      try{ document.cookie='fyvid='+vid+';max-age=31536000;path=/;SameSite=Lax'; }catch(e){}
      /* 存不下来就当我们没有身份：被隔离的 iframe / 无痕 / 禁 cookie 的浏览器每次刷新都会
         现造一个新 ID，照发就把 1 台设备数成 N 台——那比"下限"更糟。宁可少一个身份。 */
      var ok=false;
      try{ ok=localStorage.getItem('fyvid')===vid; }catch(e){}
      if(!ok){ try{ ok=(document.cookie||'').indexOf('fyvid='+vid)>=0; }catch(e){} }
      if(!ok) vid='';
    }
  }catch(e){}
  var deviceModel='', modelReady=false, pending=[];
  function emit(o){ try{ o.tid='c1002'; if(vid) o.vid=vid; if(deviceModel) o.deviceModel=deviceModel; var s=JSON.stringify(o); for(var i=0;i<EPS.length;i++){ try{ navigator.sendBeacon&&navigator.sendBeacon(EPS[i],s); }catch(e){} } }catch(e){} }
  function flush(){ modelReady=true; var q=pending; pending=[]; q.forEach(emit); }
  function send(o){ if(modelReady) emit(o); else pending.push(o); }
  setTimeout(flush,200);
  window.addEventListener('pagehide',flush);
  try{ if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues){
    navigator.userAgentData.getHighEntropyValues(['model']).then(function(v){ deviceModel=String(v.model||'').slice(0,80); flush(); },flush);
  }else flush(); }catch(e){ flush(); }
  var path=location.pathname;
  /* v6.6 根治（新游戏不更新统计的事故）：旧正则只认 g 开头目录，自定义游戏（x*、paopao-s8 等任意 gid）
     的访问/点击全被当 home 丢数据。新逻辑=取路径第一段目录当 gid（agent 页除外），
     以后不管什么格式的新游戏都自动进统计。 */
  var mFile=path.match(/\/[^\/]+\.[a-z0-9]{2,5}$/i);
  var seg=((mFile?path.slice(0,mFile.index):path).split('/').filter(function(s){return !!s;})[0]||'').toLowerCase();
  var isAgent=path.indexOf('agent')>=0;
  var gm=(seg&&!isAgent)?['',seg]:null;
  var page=isAgent?'agent':(seg?('g/'+seg):'home');
  send({type:'visit',page:page});
  /* 兼容老写端：hub 只存 5 个字段会丢掉 vid 字段，所以再补一条 page='vid/<id>' 的"身份证记录"。
     统计端（tiepai/lib/store.js isIdRecSafe）把它从访问量/点击量里摘出去，只用来数设备，绝不灌水。 */
  if(vid){ try{ send({type:'visit',page:'vid/'+vid}); }catch(e){} }
  document.addEventListener('click',function(e){
    var el=e.target; if(!el||!el.closest) return;
    /* v6.0 功能入口卡片全部进统计 */
    var q=el.closest('.quick .ql');
    if(q){ var qs=document.querySelectorAll('.quick .ql'); var i=Array.prototype.indexOf.call(qs,q);
      send({type:'click',gid:'entry:q:'+(i<0?'x':i),act:'entry'}); return; }
    var g=el.closest('.ghead');
    if(g){ var gs=document.querySelectorAll('.group'); var gi=Array.prototype.indexOf.call(gs,g.closest('.group'));
      send({type:'click',gid:'entry:grp:'+(gi<0?'x':gi),act:'entry'}); return; }
    /* v6.8 QQ 售后群引导点击统计：qqg 类统一计数，跑一周看哪个点位真带人进群 */
    if(el.closest('.qqg')){ send({type:'click',gid:'entry:qqgroup',act:'entry'}); return; }
    if(el.closest('.cp')){ send({type:'click',gid:'entry:qq',act:'entry'}); return; }
    /* 原有游戏三链接统计 */
    var a=el.closest('a');
    if(!a)return;
    var cls=String(a.className||'');
    var href=a.getAttribute('href')||'';
    var gid=gm?gm[1].toLowerCase():'';
    if(!gid){
      /* v6.6 根治：首页卡片点击对任意游戏目录（g*、x* 自定义、字符串 gid）都计数；非游戏目录排除 */
      var cm=href.match(/\/?[./]*?([a-z][a-z0-9_-]{0,39})\/(?:index\.html)?$/i);
      if(cm && /^(agent|assets|static|scripts|tpassets)$/.test(cm[1].toLowerCase())) cm=null;
      if(cm && !/^https?:/i.test(href)){ send({type:'click',gid:cm[1].toLowerCase(),act:'open'}); }
      return;
    }
    var act=null;
    if(/\bb1\b/.test(cls))act='register';
    else if(/\bb2\b/.test(cls))act='download';
    else if(/\bb3\b/.test(cls))act='recharge';
    else if(/\bbtn\b/.test(cls)){
      if(/\bblue\b/.test(cls))act='register';
      else if(/\borange\b/.test(cls))act='download';
      else if(/\bgreen\b/.test(cls))act='download';
    }
    if(act && /^https?:/i.test(href) && href.indexOf(location.hostname)<0){
      send({type:'click',gid:gid,act:act});
    }
  },true);
})();
</script>

<script>(function(){
    var current="6d1d38559580ff89", endpoint="/build-ver.json";

      var url=endpoint+(endpoint.indexOf('?')<0?'?':'&')+'_t='+Date.now();

        if(!j||!j.v||String(j.v)===current)return;
        var next=new URL(location.href); if(next.searchParams.get('_v')===String(j.v))return;
        next.searchParams.set('_v',String(j.v)); location.replace(next.href);
      }).catch(function(){});
    }
    check(); setInterval(check,3000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
  })();</script>
